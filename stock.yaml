# Lumber inventory
# Species, nominal sizes, available lengths, and sheet goods.
# Keys match the string literals used in lumber.py NOMINAL_TO_ACTUAL.
#
# PROVENANCE
# ----------
# Sizes, grades, and stocked thicknesses for cherry, cherry plywood, and
# Baltic birch are from O'Brien Hardwoods, 142 Presumpscot St, Portland ME
# (obrienhardwoods.com), read 2026-08-16.
#
# Prices carry their own provenance, per entry, in three optional fields:
#
#   price_as_of:  ISO date the price was true. REQUIRED whenever a price is
#                 set. A price without one is treated as unverified by
#                 `woodshop.checks.check_price_provenance`, which reports it
#                 as an ERROR, and every total built from it prints the
#                 marker "UNVERIFIED — placeholder prices".
#   price_valid_until:
#                 last day a SALE price holds. A special is real, dated and
#                 sourced — and temporary, which is a different kind of wrong
#                 from an invented number and a more convincing one. Past
#                 that date the check warns and any total says it includes a
#                 discount that has ended.
#   price_source: where the number came from — a quote, a price list, a shelf
#                 tag. Shown alongside the figure wherever it is published.
#   price_url:    a link to that source, when one exists.
#
# Which prices are real, as of 2026-08-17:
#
#   white cedar     REAL, and a shelf price. Lumbery's published pricing
#                   guide, read 2026-08-17. Every line of that guide is in
#                   this file: 30 profiles priced per lineal foot (one per
#                   piece) under `dimensional`, three shake grades and the
#                   lattice sheet under `unit_goods`, and the volume
#                   discount tiers under `suppliers`.
#   cherry 6/4      REAL, but a SALE price ending 2026-08-31 (O'Brien's
#   red oak 4/4     August specials). Good numbers with a fuse on them: the
#   white oak 5/4   check warns the day they lapse, and the shelf price
#   white oak 8/4   underneath them is still unknown.
#   6 mm Baltic
#   walnut 4/4      REAL, a standing special on shorts (Atlantic Hardwoods),
#                   with no end date published.
#   cherry 4/4, 5/4, 8/4, 10/4
#                   PLACEHOLDER. Undated, therefore unverified.
#   plywood         PLACEHOLDER (cherry, Baltic birch 3/4 and 1/2); birch has
#                   no price at all.
#   pine, poplar    no price.
#
# EVERY PLACEHOLDER IS DELIBERATELY LEFT UNDATED so that it reads as one.
# Neither yard publishes a full price list: O'Brien posts a handful of
# specials each month and their product pages give sizes and thicknesses
# only. The remaining cherry and plywood numbers came from nobody; they
# exist so the cost machinery has something to multiply. Quantities and
# yields are real; those dollar totals are not.
#
# Prices still to collect (see issue #3): cherry $/bd ft in 4/4, 5/4, 8/4 and
# 10/4 at the SHELF price, and whether cherry is quoted rough, S2S or S4S and
# by grade; cherry ply 3/4" 4x8; Baltic birch 3/4" in both 5x5 and 4x8, which
# are different products and should not be assumed to track; birch ply 3/4"
# and 1/2"; and any sheet minimums or cut charges. O'Brien Hardwoods,
# (207) 536-7860 — a photograph of the price board would settle all of it.
#
# The specials change monthly, which is a maintenance problem this file
# cannot solve on its own. See issue #9 on scheduled price refreshes.
#
# Softwood carries either `price_per_piece` (with `price_length_ft` saying
# which length that buys) or `price_per_lineal_ft`, whichever the supplier
# printed — never both.

dimensional:
  - species: pine
    nominal: "2x4"
    lengths_ft: [8, 10, 12]
    qty: 6

  - species: pine
    nominal: "2x6"
    lengths_ft: [8, 10, 12]
    qty: 4

  - species: pine
    nominal: "1x6"
    lengths_ft: [8]
    qty: 4

  - species: pine
    nominal: "1x4"
    lengths_ft: [8]
    qty: 4

  - species: poplar
    nominal: "1x3"
    lengths_ft: [8]
    qty: 2

  # ---------------------------------------------------------------------
  # Northern white cedar — Lumbery, 287 Ocean House Rd, Cape Elizabeth ME
  # (207) 835-7023. Prices read from their published White Cedar Lumber
  # Pricing Guide on 2026-08-17; the page prints no effective date of its
  # own, so price_as_of is the day it was read.
  #
  # These are the first real prices in this file. They are quoted per
  # LINEAL FOOT, not per piece and not per board foot — the guide's own
  # unit, kept as published rather than converted into a house unit.
  #
  # `lengths_ft` is empty on every entry: the guide prices the stock but
  # does not say what lengths are carried. That is enough to estimate a
  # fence and not enough to lay out a cut list; ask when ordering.
  #
  # Nominal sizes for rough sawn stock are close to full dimension — a
  # rough 1x6 is about a full 1" x 6" — so `lumber.NOMINAL_TO_ACTUAL`,
  # which holds dressed sizes, does not describe those entries.
  #
  # The rest of the guide — shakes by the bundle and lattice by the sheet —
  # is under `unit_goods` at the foot of this file, and the volume discounts
  # are under `suppliers`. Both used to be comments here, for want of a unit
  # the schema could express; the effect was that the only prices missing
  # from a complete price list were the two nobody could model.
  # ---------------------------------------------------------------------
