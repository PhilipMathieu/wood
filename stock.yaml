# Hardwood is sold rough, in random widths, and priced by the board foot, so
# width is an outcome of milling rather than a property of the stock.
# `surfaced_thickness_in` is the number to design to.
#
# O'Brien stocks cherry in 4/4, 5/4, 6/4, 8/4, 10/4 and 12/4 (16/4 to order),
# kiln dried to 6-10% MC, sold RWL — random widths and lengths.
hardwood:
  - species: cherry
    thickness_quarter: "4/4"
    rough_thickness_in: 1.0
    surfaced_thickness_in: 0.75
    typical_width_in: 7
    lengths_ft: [8, 10]
    qty_board_feet: 0        # buy to suit
    price_per_bf: 12.50
    price_source: "PLACEHOLDER — invented, never quoted"   # no price_as_of: unverified

  - species: cherry
    thickness_quarter: "5/4"
    rough_thickness_in: 1.25
    surfaced_thickness_in: 1.0
    typical_width_in: 7
    lengths_ft: [8, 10]
    qty_board_feet: 0
    price_per_bf: 13.50
    price_source: "PLACEHOLDER — invented, never quoted"

  # The one cherry price that is real, and it is a SALE price: O'Brien's
  # August 2026 specials sheet. The sheet is headed "AUGUST SPECIALS" with
  # no explicit end date, so price_valid_until is end of month, inferred.
  # After that the check flags it and the shelf price is still unknown —
  # which is the point of recording the end date rather than the number
  # alone. $5.25 against the $14.00 placeholder that sat here is a fair
  # measure of how much an invented number is worth.
  - species: cherry
    thickness_quarter: "6/4"
    rough_thickness_in: 1.5
    surfaced_thickness_in: 1.25
    typical_width_in: 7
    lengths_ft: [8, 10]
    qty_board_feet: 0
    price_per_bf: 5.25
    price_as_of: 2026-08-17
    price_valid_until: 2026-08-31
    price_source: "O'Brien Hardwoods, August 2026 specials sheet"
    price_url: "https://obrienhardwoods.com/specials"

  - species: cherry
    thickness_quarter: "8/4"
    rough_thickness_in: 2.0
    surfaced_thickness_in: 1.75
    typical_width_in: 6
    lengths_ft: [8, 10]
    qty_board_feet: 0
    price_per_bf: 15.00
    price_source: "PLACEHOLDER — invented, never quoted"

  # 10/4 is stocked, so a true 2" post is buyable — it does not need a
  # lamination. See NOTES.md on the post-size inference.
  - species: cherry
    thickness_quarter: "10/4"
    rough_thickness_in: 2.5
    surfaced_thickness_in: 2.25
    typical_width_in: 6
    lengths_ft: [8, 10]
    qty_board_feet: 0
    price_per_bf: 17.00
    price_source: "PLACEHOLDER — invented, never quoted"

  # ---------------------------------------------------------------------
  # The rest of O'Brien's August 2026 specials, read from the sheet on
  # 2026-08-17. Real prices, real species, all of them SALE prices ending
  # with the month. The sheet's own small print: "ALL SPECIALS ARE SUBJECT
  # TO AVAILABILITY AND PRIOR SALE."
  #
  # What the specials sheet gives is species, quarter thickness and price.
  # It says nothing about width, length, grade or surfacing, so
  # `typical_width_in` and `lengths_ft` below follow the same convention as
  # the cherry entries — 7" for 4/4-6/4, 6" for 8/4 and up, 8 and 10 ft —
  # and are ASSUMPTIONS for yield estimation, not quoted facts.
  # ---------------------------------------------------------------------
  - species: red_oak
    thickness_quarter: "4/4"
    rough_thickness_in: 1.0
    surfaced_thickness_in: 0.75
    typical_width_in: 7        # assumed
    lengths_ft: [8, 10]        # assumed
    qty_board_feet: 0
    price_per_bf: 2.99
    price_as_of: 2026-08-17
    price_valid_until: 2026-08-31
    price_source: "O'Brien Hardwoods, August 2026 specials sheet"
    price_url: "https://obrienhardwoods.com/specials"

  - species: white_oak
    thickness_quarter: "5/4"
    rough_thickness_in: 1.25
    surfaced_thickness_in: 1.0
    typical_width_in: 7        # assumed
    lengths_ft: [8, 10]        # assumed
    qty_board_feet: 0
    price_per_bf: 8.90
    price_as_of: 2026-08-17
    price_valid_until: 2026-08-31
    price_source: "O'Brien Hardwoods, August 2026 specials sheet"
    price_url: "https://obrienhardwoods.com/specials"

  - species: white_oak
    thickness_quarter: "8/4"
    rough_thickness_in: 2.0
    surfaced_thickness_in: 1.75
    typical_width_in: 6        # assumed
    lengths_ft: [8, 10]        # assumed
    qty_board_feet: 0
    price_per_bf: 9.79
    price_as_of: 2026-08-17
    price_valid_until: 2026-08-31
    price_source: "O'Brien Hardwoods, August 2026 specials sheet"
    price_url: "https://obrienhardwoods.com/specials"

  # Atlantic Hardwoods, 151 Saint John St, Portland ME, (207) 773-9663.
  # Their specials page lists one lumber item, read 2026-08-17. "4/4 Walnut
  # 4'-6' Shorts $8.50/bf" — the page gives no end date, so none is
  # recorded; it is a standing special until it is not. Lengths are the
  # quoted 4-6 ft range read as 4, 5 and 6; the width is assumed.
  #
  # Also on that page and NOT recorded, for want of a unit the schema has:
  # red oak stair treads 3/4 x 11-1/2 at $25.00 (36"), $34.00 (42"),
  # $36.00 (48") and $62.00 (60") each, and prefinished 2-1/4" red oak
  # flooring at $4.69/SF. A tread is a finished component, not stock, and
  # nothing here is priced by the square foot.
  - species: walnut
    thickness_quarter: "4/4"
    rough_thickness_in: 1.0
    surfaced_thickness_in: 0.75
    typical_width_in: 6        # assumed
    lengths_ft: [4, 5, 6]      # "4'-6' Shorts"
    qty_board_feet: 0
    price_per_bf: 8.50
    price_as_of: 2026-08-17
    price_source: "Atlantic Hardwoods, specials page (4/4 walnut shorts)"
    price_url: "https://www.atlantichardwoods.com/specials"

