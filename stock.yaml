  # ---------------------------------------------------------------------
  # Fence hardware — the half of a gate that is not wood.
  #
  # Everything above this comment is bought from a lumber yard, and every
  # price above carries the yard's own guide behind it. Nothing below is.
  # These are big-box and farm-store prices, relayed by the owner on
  # 2026-08-18 with SKUs where a SKU exists; they were not read off the
  # retailers' pages by anything in this repository, because the egress
  # proxy blocks every one of those domains. `price_source` says so on
  # each line rather than in a comment nobody reads, so a total built from
  # them can be traced back to a person and a day.
  #
  # Two tiers, in `grade`. "heavy duty" is the thing that outlives the
  # fence; "budget" is the imported equivalent that does the same job for
  # a third of the money and will be the reason somebody rehangs a gate in
  # 2036. Both are real products at real prices, and the design prices
  # whichever tier it is asked for rather than picking one and calling it
  # the cost. The swing between them is almost entirely hinges.
  #
  # `count_per_unit` is what makes a package a quantity: 25 bolts in a box
  # and about 340 staples in a 5 lb carton are the numbers that turn a
  # count derived from geometry into a number of things to put in a cart.

  - species: steel
    item: tee hinge, 12", bolted
    unit: each
    grade: heavy duty
    qty: 0
    price_per_unit: 27.47
    price_as_of: 2026-08-18
    price_source: "Everbilt extra heavy-duty, Home Depot SKU 20484 — relayed by the owner"
    notes: >-
      A gate leaf is a cantilever off its hinges and the top one carries
      the pull. Three per leaf, bolted through the stile — a screw into
      end-grain-adjacent cedar is what fails first on a wooden gate.

  - species: steel
    item: tee hinge, 12", bolted
    unit: each
    grade: budget
    qty: 0
    price_per_unit: 7.50
    price_as_of: 2026-08-18
    price_source: "12 in T-strap 6-packs, Home Depot online, ~$45/6 — relayed by the owner"
    notes: >-
      A quarter of the heavy-duty price and the largest single saving
      available on this fence. Lighter steel and a thinner pin; on a 4 ft
      leaf that is a real bet rather than an obvious mistake.

  - species: steel
    item: gate latch, thumb
    unit: each
    grade: heavy duty
    qty: 0
    price_per_unit: 26.98
    price_as_of: 2026-08-18
    price_source: "Everbilt heavy-duty thumb latch, Home Depot — relayed by the owner"

  - species: steel
    item: gate latch, thumb
    unit: each
    grade: budget
    qty: 0
    price_per_unit: 13.00
    price_as_of: 2026-08-18
    price_source: "plainer Home Depot latch — relayed by the owner"

  - species: steel
    item: cane bolt with retainer, 18-24"
    unit: set
    grade: heavy duty
    qty: 0
    price_per_unit: 35.00
    price_as_of: 2026-08-18
    price_source: "Everbilt/National, Home Depot, $24-$35 — relayed by the owner"
    notes: >-
      One per pair of leaves: it pins the inactive leaf so the latch is
      not holding both. The retainer that comes with it is the stop; the
      ground sleeve is not included and is a separate line below.

  - species: steel
    item: cane bolt with retainer, 18-24"
    unit: set
    grade: budget
    qty: 0
    price_per_unit: 24.00
    price_as_of: 2026-08-18
    price_source: "Everbilt/National, Home Depot, $24-$35 — relayed by the owner"

  - species: steel
    item: 'drop rod ground sleeve, 1 ft of 3/4-1" pipe'
    unit: each
    qty: 0
    price_per_unit: 5.00
    price_as_of: 2026-08-18
    price_source: "offcut of galvanised or PVC pipe, set in the post stone — owner's estimate"
    notes: >-
      No big-box cane bolt includes one. Without a sleeve the rod drills
      its own hole in the dirt, which silts up over one winter and stops
      being a hole. A foot of pipe set in the stone when the gate post
      goes in costs five dollars and is the difference between a gate that
      still pins in ten years and one that does not.

  - species: steel
    item: post cap
    unit: each
    grade: heavy duty
    qty: 0
    price_per_unit: 9.00
    price_as_of: 2026-08-18
    price_source: "galvanised steel 4x4 caps, $3-$9 ea — relayed by the owner"
    notes: >-
      A cap is not decoration: an unprotected post end is end grain
      pointing at the sky, and it is where a post rots from.

  - species: steel
    item: post cap
    unit: each
    grade: budget
    qty: 0
    price_per_unit: 3.00
    price_as_of: 2026-08-18
    price_source: "wood pyramid 4x4 caps, $3-$9 ea — relayed by the owner"
    notes: >-
      Round posts of 5 in and 6 in are not 4x4s. These fit a sawn post;
      on a round post the equivalent is a bevel cut on the top so water
      runs off, which costs nothing but a saw.

