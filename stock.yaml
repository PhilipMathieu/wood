# Lumber inventory
# Species, nominal sizes, available lengths, and sheet goods.
# Keys match the string literals used in lumber.py NOMINAL_TO_ACTUAL.
#
# PROVENANCE
# ----------
# Sizes, grades, and stocked thicknesses for cherry, cherry plywood, and
# Baltic birch are from O'Brien Hardwoods, 142 Presumpscot St, Portland ME
# (obrienhardwoods.com), read 2026-08-16.
#
# Prices carry their own provenance, per entry, in three optional fields:
#
#   price_as_of:  ISO date the price was true. REQUIRED whenever a price is
#                 set. A price without one is treated as unverified by
#                 `woodshop.checks.check_price_provenance`, which reports it
#                 as an ERROR, and every total built from it prints the
#                 marker "UNVERIFIED — placeholder prices".
#   price_source: where the number came from — a quote, a price list, a shelf
#                 tag. Shown alongside the figure wherever it is published.
#   price_url:    a link to that source, when one exists.
#
# EVERY PRICE BELOW IS STILL AN UNVERIFIED PLACEHOLDER, and is deliberately
# left undated so that it reads as one. O'Brien does not publish prices;
# none of these came from a quote. They exist so the cost machinery has
# something to multiply. Quantities and yields are real; dollar totals are
# not. Replace them — number, date, and source together — after a phone call
# or a visit, before trusting any cost figure.
#
# Prices still to collect (see issue #3): cherry $/bd ft in 4/4 through 10/4
# and whether it is quoted rough, S2S or S4S and by grade; cherry ply 3/4"
# 4x8; Baltic birch 3/4" in both 5x5 and 4x8, which are different products
# and should not be assumed to track; birch ply 3/4" and 1/2"; and any sheet
# minimums or cut charges. Dimensional softwood is unpriced too — it takes
# `price_per_piece` with a `price_length_ft` saying which length that buys.

dimensional:
  - species: pine
    nominal: "2x4"
    lengths_ft: [8, 10, 12]
    qty: 6

  - species: pine
    nominal: "2x6"
    lengths_ft: [8, 10, 12]
    qty: 4

  - species: pine
    nominal: "1x6"
    lengths_ft: [8]
    qty: 4

  - species: pine
    nominal: "1x4"
    lengths_ft: [8]
    qty: 4

  - species: poplar
    nominal: "1x3"
    lengths_ft: [8]
    qty: 2

# Hardwood is sold rough, in random widths, and priced by the board foot, so
# width is an outcome of milling rather than a property of the stock.
# `surfaced_thickness_in` is the number to design to.
#
# O'Brien stocks cherry in 4/4, 5/4, 6/4, 8/4, 10/4 and 12/4 (16/4 to order),
# kiln dried to 6-10% MC, sold RWL — random widths and lengths.
hardwood:
  - species: cherry
    thickness_quarter: "4/4"
    rough_thickness_in: 1.0
    surfaced_thickness_in: 0.75
    typical_width_in: 7
    lengths_ft: [8, 10]
    qty_board_feet: 0        # buy to suit
    price_per_bf: 12.50
    price_source: "PLACEHOLDER — invented, never quoted"   # no price_as_of: unverified

  - species: cherry
    thickness_quarter: "5/4"
    rough_thickness_in: 1.25
    surfaced_thickness_in: 1.0
    typical_width_in: 7
    lengths_ft: [8, 10]
    qty_board_feet: 0
    price_per_bf: 13.50
    price_source: "PLACEHOLDER — invented, never quoted"

  - species: cherry
    thickness_quarter: "6/4"
    rough_thickness_in: 1.5
    surfaced_thickness_in: 1.25
    typical_width_in: 7
    lengths_ft: [8, 10]
    qty_board_feet: 0
    price_per_bf: 14.00
    price_source: "PLACEHOLDER — invented, never quoted"

  - species: cherry
    thickness_quarter: "8/4"
    rough_thickness_in: 2.0
    surfaced_thickness_in: 1.75
    typical_width_in: 6
    lengths_ft: [8, 10]
    qty_board_feet: 0
    price_per_bf: 15.00
    price_source: "PLACEHOLDER — invented, never quoted"

  # 10/4 is stocked, so a true 2" post is buyable — it does not need a
  # lamination. See NOTES.md on the post-size inference.
  - species: cherry
    thickness_quarter: "10/4"
    rough_thickness_in: 2.5
    surfaced_thickness_in: 2.25
    typical_width_in: 6
    lengths_ft: [8, 10]
    qty_board_feet: 0
    price_per_bf: 17.00
    price_source: "PLACEHOLDER — invented, never quoted"

sheet_goods:
  - material: plywood_birch
    nominal_thickness: "3/4"
    actual_thickness_in: 0.71875   # 23/32"
    sheet_width_in: 48
    sheet_height_in: 96
    qty: 2

  - material: plywood_birch
    nominal_thickness: "1/2"
    actual_thickness_in: 0.46875   # 15/32"
    sheet_width_in: 48
    sheet_height_in: 96
    qty: 1

  # Cherry plywood: 4x8 only, in 1/4", 1/2" and 3/4". Face grain runs along
  # the 96" side.
  - material: plywood_cherry
    nominal_thickness: "3/4"
    actual_thickness_in: 0.703125  # 45/64" — veneer-core cherry ply runs thin
    sheet_width_in: 48
    sheet_height_in: 96
    qty: 0
    grain: length
    price_per_sheet: 185.00
    price_source: "PLACEHOLDER — invented, never quoted"

  # Baltic birch, B/BB grade, comes in TWO sizes and the choice is not just
  # about area:
  #   5'x5'  interior glue  — lasers cleanly, but only 60" long
  #   4'x8'  exterior glue  — takes a 62-1/2" part whole, but chars under a laser
  # Anything longer than 60" has to come off the 4x8 sheet.
  - material: plywood_baltic_birch
    nominal_thickness: "3/4"
    actual_thickness_in: 0.7087    # 18 mm
    sheet_width_in: 60
    sheet_height_in: 60
    qty: 0
    grain: none
    price_per_sheet: 145.00
    price_source: "PLACEHOLDER — invented, never quoted"
    notes: "B/BB, interior glue, laser-friendly"

  - material: plywood_baltic_birch
    nominal_thickness: "3/4"
    actual_thickness_in: 0.7087    # 18 mm (assumed same as the 5x5 — unconfirmed)
    sheet_width_in: 48
    sheet_height_in: 96
    qty: 0
    grain: none
    price_per_sheet: 175.00
    price_source: "PLACEHOLDER — invented, never quoted"
    notes: "B/BB, exterior glue, chars under a laser"

  - material: plywood_baltic_birch
    nominal_thickness: "1/2"
    actual_thickness_in: 0.4724    # 12 mm
    sheet_width_in: 60
    sheet_height_in: 60
    qty: 0
    grain: none
    price_per_sheet: 105.00
    price_source: "PLACEHOLDER — invented, never quoted"
    notes: "B/BB, interior glue"
