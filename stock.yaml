# Hardwood is sold rough, in random widths, and priced by the board foot, so
# width is an outcome of milling rather than a property of the stock.
# `surfaced_thickness_in` is the number to design to.
#
# O'Brien stocks cherry in 4/4, 5/4, 6/4, 8/4, 10/4 and 12/4 (16/4 to order),
# kiln dried to 6-10% MC, sold RWL — random widths and lengths.
hardwood:
  - species: cherry
    thickness_quarter: "4/4"
    rough_thickness_in: 1.0
    surfaced_thickness_in: 0.75
