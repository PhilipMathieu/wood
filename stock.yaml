    nominal: "1x3"
    lengths_ft: []
    qty: 0
    grade: STK
    profile: dressed
    price_per_lineal_ft: 1.10
    price_as_of: 2026-08-17
    price_source: "Lumbery, White Cedar Lumber Pricing Guide"
    price_url: "https://lumbery-me.com/pricing-guide-featuring-cedar-shiplap-siding/"

